name: Profile 3D Contributions

# Regenerates the live 3D contribution calendar, language pie and stats
# shown in README.md from real GitHub data. Runs daily, on demand, and
# whenever the README or this workflow changes.
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution graph"; then
            git push
          fi
